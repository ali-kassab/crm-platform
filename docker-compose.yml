# Local development stack. Usage:
#   cp .env.example .env
#   docker compose up -d                          # infrastructure only (run backend/frontend from IDE)
#   docker compose --profile app up -d --build    # full stack in containers
#   docker compose --profile observability up -d  # + Prometheus & Grafana
name: crm-platform

services:
  postgres:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-crm}
      POSTGRES_USER: ${DB_USERNAME:-crm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.2.11-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  storage:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - storage-data:/data
    restart: unless-stopped

  # ---------- Application (profile "app"; R13) ----------
  # Browser → http://localhost:${WEB_PORT:-8088}; nginx in "frontend" proxies /api and /realtime.
  backend:
    profiles: ["app"]
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-crm}
      DB_USERNAME: ${DB_USERNAME:-crm}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-no-reply@crm-platform.local}
      S3_ENDPOINT: http://storage:9000
      # presigned URLs are opened by the browser, so they must use a host it can reach
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-crm-files}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_PATH_STYLE: "true"
      S3_CREATE_BUCKET: ${S3_CREATE_BUCKET:-true}
      CLIENT_BASE_URL: http://localhost:${WEB_PORT:-8088}
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-8088}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      BILLING_ENFORCEMENT_ENABLED: ${BILLING_ENFORCEMENT_ENABLED:-true}
      REALTIME_ENABLED: ${REALTIME_ENABLED:-true}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage: { condition: service_started }
      mailpit: { condition: service_started }
    restart: unless-stopped

  realtime:
    profiles: ["app"]
    build: ./realtime-service
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-8088}
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    profiles: ["app"]
    build: ./frontend
    ports:
      - "${WEB_PORT:-8088}:8080"
    depends_on:
      backend: { condition: service_healthy }
      realtime: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  storage-data:
