<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><title>Reset your password</title></head>
<body style="font-family: Arial, sans-serif; color: #111827; line-height: 1.5;">
  <p>Hi <span th:text="${firstName}">there</span>,</p>
  <p>We received a request to reset your CRM Platform password.</p>
  <p><a th:href="${resetUrl}" style="background:#111827;color:#ffffff;padding:10px 16px;border-radius:6px;text-decoration:none;">Reset password</a></p>
  <p>This link expires in <span th:text="${expiresInMinutes}">30</span> minutes. If you did not request it, you can ignore this email.</p>
</body>
</html>
