<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ar" dir="rtl">
<head><meta charset="UTF-8"><title>إعادة تعيين كلمة المرور</title></head>
<body dir="rtl" style="font-family: Tahoma, Arial, sans-serif; color: #111827; line-height: 1.8; text-align: right;">
  <p>مرحبًا <span th:text="${firstName}">بك</span>،</p>
  <p>تلقّينا طلبًا لإعادة تعيين كلمة المرور الخاصة بحسابك.</p>
  <p><a th:href="${resetUrl}" style="background:#111827;color:#ffffff;padding:10px 16px;border-radius:6px;text-decoration:none;">إعادة تعيين كلمة المرور</a></p>
  <p>تنتهي صلاحية هذا الرابط خلال <span th:text="${expiresInMinutes}">30</span> دقيقة. إذا لم تطلب ذلك يمكنك تجاهل هذه الرسالة.</p>
</body>
</html>
