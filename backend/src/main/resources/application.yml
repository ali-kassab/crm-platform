spring:
  application:
    name: crm-platform
  threads:
    virtual:
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crm}
    username: ${DB_USERNAME:crm}
    password: ${DB_PASSWORD:crm}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 55MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  cache:
    type: redis
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
  thymeleaf:
    check-template-location: false
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
      republish-outstanding-events-on-restart: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true

app:
  security:
    jwt-secret: ${JWT_SECRET:}
    secure-cookies: ${SECURE_COOKIES:true}
  mail:
    from: ${MAIL_FROM:no-reply@crm-platform.local}
  storage:
    endpoint: ${S3_ENDPOINT:}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:crm-files}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    path-style: ${S3_PATH_STYLE:true}
    create-bucket: ${S3_CREATE_BUCKET:false}
  client-base-url: ${CLIENT_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  platform-admin:
    # One-time bootstrap of the first platform admin (no HTTP endpoint exists for this).
    # Set both, start once, then remove PLATFORM_ADMIN_PASSWORD from the environment.
    bootstrap:
      email: ${PLATFORM_ADMIN_EMAIL:}
      password: ${PLATFORM_ADMIN_PASSWORD:}
      first-name: ${PLATFORM_ADMIN_FIRST_NAME:Platform}
      last-name: ${PLATFORM_ADMIN_LAST_NAME:Admin}
    session-ttl: ${PLATFORM_ADMIN_SESSION_TTL:10m}

logging:
  level:
    root: INFO
    com.crmplatform: INFO

---
spring:
  config:
    activate:
      on-profile: dev
app:
  storage:
    create-bucket: true
logging:
  level:
    com.crmplatform: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
logging:
  structured:
    format:
      console: ecs
