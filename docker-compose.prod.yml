# Production overrides for a single-host install (R13). Configuration only — nothing here deploys.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app up -d --build
# Differences from local development:
#   - databases/storage are not published on host ports; only the web container is, on loopback,
#     for a TLS-terminating reverse proxy or load balancer in front (HTTPS is required: cookies are Secure)
#   - no Mailpit: real SMTP settings are required
#   - bucket must already exist; memory limits; JSON logs (Spring "prod" profile)
services:
  postgres:
    ports: !reset []
    deploy: { resources: { limits: { memory: 1g } } }
  redis:
    ports: !reset []
    deploy: { resources: { limits: { memory: 256m } } }
  storage:
    ports: !reset []
  mailpit:
    profiles: ["dev-mail"]   # never started in production
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MAIL_HOST: ${MAIL_HOST:?set MAIL_HOST (SMTP) in .env}
      MAIL_PORT: ${MAIL_PORT:-587}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?set S3_PUBLIC_ENDPOINT (browser-reachable storage URL)}
      S3_CREATE_BUCKET: "false"
      CLIENT_BASE_URL: ${PUBLIC_URL:?set PUBLIC_URL e.g. https://app.example.com}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL}
      SECURE_COOKIES: "true"
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
    depends_on: !override
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage: { condition: service_started }
    deploy: { resources: { limits: { memory: 1536m } } }
  realtime:
    environment:
      ALLOWED_ORIGINS: ${PUBLIC_URL}
    deploy: { resources: { limits: { memory: 256m } } }
  frontend:
    ports: !override
      - "127.0.0.1:${WEB_PORT:-8088}:8080"
