# Render Blueprint — Java API for PRIVATE TESTING on a FREE instance (no paid resources).
# Guide, measured limits and setup order: docs/operations/free-tier-deployment.md
# Secrets are never stored here: `sync: false` values are entered by the owner in the Render
# dashboard; JWT_SECRET is generated by Render.
services:
  - type: web
    name: crm-staging-api
    runtime: docker
    plan: free
    region: frankfurt                 # same region as the Neon and Upstash databases
    branch: feature/saas-foundation
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health/liveness   # no database/Redis calls: lets Neon scale to zero
    autoDeployTrigger: commit
    buildFilter:
      paths: ["backend/**", "render.yaml"]
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # 0.1 CPU / 512 MB: measured start 163 s and ~440 MB peak with these flags (459 s with the defaults)
      - key: JAVA_TOOL_OPTIONS
        value: -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k -XX:MaxRAMPercentage=60 -XX:ReservedCodeCacheSize=64m -XX:+ExitOnOutOfMemoryError -Djava.awt.headless=true

      # PostgreSQL (Neon, DIRECT endpoint, not the "-pooler" one; ?sslmode=require)
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      # no idle connections and no keep-alive pings, so Neon can suspend between uses (100 CU-hours/month)
      - key: SPRING_DATASOURCE_HIKARI_MINIMUMIDLE
        value: "0"
      - key: SPRING_DATASOURCE_HIKARI_IDLETIMEOUT
        value: "60000"
      - key: SPRING_DATASOURCE_HIKARI_KEEPALIVETIME
        value: "0"
      - key: SPRING_DATASOURCE_HIKARI_MAXLIFETIME
        value: "300000"

      # Redis (Upstash, TLS)
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: SPRING_DATA_REDIS_SSL_ENABLED
        value: "true"

      # Object storage (S3-compatible; Backblaze B2 for $0 without a payment method)
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PUBLIC_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_PATH_STYLE
        value: "true"
      - key: S3_CREATE_BUCKET
        value: "false"
      # checksums only when the S3 API requires them (broadest S3-compatible support)
      - key: AWS_REQUEST_CHECKSUM_CALCULATION
        value: WHEN_REQUIRED
      - key: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: WHEN_REQUIRED

      # Security / URLs (the Vercel production URL, e.g. https://<project>.vercel.app)
      - key: JWT_SECRET
        generateValue: true
      - key: SECURE_COOKIES
        value: "true"
      - key: CLIENT_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # First platform admin: set both for the FIRST start, then delete PLATFORM_ADMIN_PASSWORD
      - key: PLATFORM_ADMIN_EMAIL
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false

      # Mail is optional for private testing (failures are only logged). Free Render blocks SMTP
      # ports 25/465/587; a provider on port 2525 works (e.g. Brevo smtp-relay.brevo.com:2525).
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "2525"
      - key: MAIL_FROM
        sync: false

      # The NestJS realtime service is not deployed (optional by design, ADR-0015)
      - key: REALTIME_ENABLED
        value: "false"
